apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: satellite-ml
  template:
    metadata:
      labels:
        app: satellite-ml
    spec:
      containers:
        - name: satellite-ml
          image: satellite-ml-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"